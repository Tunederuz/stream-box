# Checks on pull requests to main and on main itself (work happens on branches, merged through a pull request: a
# branch push alone runs nothing); tools/check.sh runs the same ones locally, in Docker
name: checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -t . -v   # tests needing mpv or luajit are skipped here

  lua:   # same mpv as the box image (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed mpv luajit python git
      - uses: actions/checkout@v4
      - run: python -m unittest tests.test_lua -v

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git ls-files '*.sh' | xargs shellcheck -S warning

  qml:   # qmllint and the qmlshots scenario (tools/qmlshots, Docker: PySide6 of the box, Xvfb, Mesa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/check.sh qml
