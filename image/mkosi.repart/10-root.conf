# System partition: compressed btrfs (zstd), shrunk to the minimum at build time (no empty space written to the USB
# drive); it grows to the whole disk at first boot (/usr/lib/repart.d/10-root.conf)
# Label stream-box_<version> (%A: IMAGE_VERSION of the image's os-release): what the UKI boots (root=PARTLABEL=…) and
# how systemd-sysupdate tells the A/B slots' versions apart
[Partition]
Type=root
Label=stream-box_%A
Format=btrfs
Compression=zstd
CopyFiles=/
Minimize=best
