# Inlet: SSH host keys in /etc/ssh/keys, kept on the data partition across system updates (made by
# /usr/local/lib/stream-box/persist restore): the box keeps the same identity, no "host key changed" warning
HostKey /etc/ssh/keys/ssh_host_ed25519_key
HostKey /etc/ssh/keys/ssh_host_ecdsa_key
HostKey /etc/ssh/keys/ssh_host_rsa_key
