# Owlink: Wake-on-LAN (magic packet) on every Ethernet connection, so that Home Assistant can power the box on.
# Without it the r8169 driver powers the Ethernet port down at shutdown (link light off, no wake-up). The BIOS
# option must be on too. A number here (NMSettingWiredWakeOnLan flags, 64 = magic): "magic" is silently ignored.
[connection]
ethernet.wake-on-lan=64
