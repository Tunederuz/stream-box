# Stream Box : au démarrage, session de la box sans écran de connexion (stream-box-session : cage, Ctrl+Alt+F2… vers
# une console).
# Si elle se termine, écran de connexion texte (agreety).
[terminal]
vt = 1

[initial_session]
command = "/usr/local/bin/stream-box-session"
user = "media"

[default_session]
command = "agreety --cmd bash"
user = "greeter"
