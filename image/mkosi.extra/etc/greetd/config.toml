# Stream Box : au démarrage, session de la box sans écran de connexion (cage -s : Ctrl+Alt+F2… vers une console).
# Si elle se termine, écran de connexion texte (agreety).
[terminal]
vt = 1

[initial_session]
command = "cage -s -- /home/media/stream-box/start.sh"
user = "media"

[default_session]
command = "agreety --cmd bash"
user = "greeter"
