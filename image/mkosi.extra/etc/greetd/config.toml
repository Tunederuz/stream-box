# Stream Box: at boot, box session without a login screen (stream-box-session: cage, Ctrl+Alt+F2… to a console).
# If it ends, text login screen (agreety).
[terminal]
vt = 1

[initial_session]
command = "/usr/local/bin/stream-box-session"
user = "media"

[default_session]
command = "agreety --cmd bash"
user = "greeter"
