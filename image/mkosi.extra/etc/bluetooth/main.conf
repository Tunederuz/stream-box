# Inlet: BlueZ settings (the others: BlueZ's defaults)
[General]
# A device paired here that lost its keys (an Xbox controller paired with a console or a PC in between) pairs again
# without the menu: otherwise BlueZ refuses it and it never connects any more
JustWorksRepairing = always
# Paired devices reconnect faster (page scan more often)
FastConnectable = true

[Policy]
AutoEnable = true
