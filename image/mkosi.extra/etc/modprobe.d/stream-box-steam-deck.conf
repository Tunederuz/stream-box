# Inlet: the Steam Deck's (and Steam Controller's) built-in controller as a gamepad, not a keyboard and mouse.
# By default hid-steam emulates them ("lizard mode": d-pad as arrows, A as Enter, B as Escape, trackpad as a mouse)
# until the gamepad is used by Steam or ☰ is held for 2 s, and then sends no gamepad keys: Steam, "…" and the others
# did nothing. As a gamepad, input.py gets them all (BTN_MODE: TV menu, BTN_BASE: home screen…). Read when the
# driver loads: after a restart (or /sys/module/hid_steam/parameters/lizard_mode set to N at once).
options hid_steam lizard_mode=0
