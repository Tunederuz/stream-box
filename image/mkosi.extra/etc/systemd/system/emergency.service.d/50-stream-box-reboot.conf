# Stream Box: emergency mode restarts the box instead of waiting at a root prompt nobody can use (the root account
# is locked, and the boot screen hides it: a "frozen" boot screen). Seen on a Steam Deck booting from an SD card that
# sometimes fails to start on a cold boot: the system partition never shows up, the next boot goes through. Also in
# the initrd (mkosi.initrd.conf), where that wait happens. A broken image restarts in a loop instead of freezing.
# The message and the 10 s pause are optional ("-": the initrd may lack sh), the restart is not.
[Service]
ExecStartPre=-/bin/sh -c 'echo "Stream Box: the boot failed, restarting in 10 s"; sleep 10'
ExecStart=
ExecStart=/usr/bin/systemctl --no-block reboot
