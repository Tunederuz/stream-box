# Stream Box : Plymouth s'arrête en laissant son image (logo, fond) à l'écran jusqu'à ce que cage le prenne : pas de
# retour au noir entre l'écran de démarrage et la TV. (Ne pas masquer ce service : greetd attend sa fin, via
# plymouth-quit-wait.service.)
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
