# First boot on the machine (systemd-repart): the system partition, shrunk to the minimum in the image, grows to its
# fixed size, and its file system along with it (GrowFileSystem). Fixed: on an installed box it is one of the two A/B
# slots (see install-to-disk), the rest of the disk being the data partition (30-data.conf)
[Partition]
Type=root
SizeMinBytes=5G
SizeMaxBytes=5G
GrowFileSystem=yes
