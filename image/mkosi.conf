# Stream Box : image disque prête à flasher (mkosi, base Arch). Construction : image/build.sh (conteneur Docker).
# Le système démarre directement sur la box (greetd lance la session cage de l'utilisateur media) ; le reste de la
# configuration (streamers, Twitch, Jellyfin, MQTT…) se fait depuis la télécommande web, rien de personnel ici.

[Distribution]
Distribution=arch

[Output]
Format=disk
ImageId=stream-box
Output=stream-box
OutputDirectory=mkosi.output

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=rw quiet loglevel=3
Hostname=stream-box
Locale=fr_FR.UTF-8
Keymap=fr
Timezone=Europe/Paris
# Le dépôt entier est copié dans l'image par mkosi.prepare.chroot (/work/src)
BuildSources=..:stream-box
Packages=
    base
    linux
    linux-firmware
    intel-ucode
    amd-ucode
    mesa
    vulkan-intel
    vulkan-nouveau
    vulkan-radeon
    intel-media-driver
    libva-utils
    pipewire
    pipewire-pulse
    pipewire-alsa
    wireplumber
    alsa-utils
    bluez
    bluez-utils
    networkmanager
    btrfs-progs
    wpa_supplicant
    dnsmasq
    iw
    openssh
    sudo
    greetd
    cage
    mpv
    ffmpeg
    grim
    wlr-randr
    python
    git
    curl
    polkit
    udisks2
    exfatprogs
    dosfstools
    libpulse
    nodejs
    npm
    noto-fonts
    noto-fonts-emoji
    ttf-dejavu
    fontconfig
    libxkbcommon
    xcb-util-cursor
    dbus
    less
    nano
    htop

[Build]
# Réseau pour mkosi.prepare.chroot : venvs Python (pip) et serveur de jetons YouTube (npm)
WithNetwork=yes
CacheDirectory=mkosi.cache
