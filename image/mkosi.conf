# Stream Box: ready-to-flash disk image (mkosi, Arch based). Build: image/build.sh (Docker container).
# The system boots straight into the box (greetd starts the cage session of the media user); the rest of the
# configuration (streamers, Twitch, Jellyfin, MQTT…) is done from the companion app, nothing personal here.

[Distribution]
Distribution=arch

[Output]
Format=disk
ImageId=stream-box
Output=stream-box
OutputDirectory=mkosi.output
# A/B updates (systemd-sysupdate, /usr/lib/sysupdate.d): the system partition and the UKI also as separate files
# (stream-box.root-x86-64.raw, stream-box.efi), published with each release by build.sh release. The version comes from
# build.sh (--image-version: the tag, or git describe), written by mkosi into os-release (IMAGE_VERSION)
SplitArtifacts=uki,partitions
# UKI in the ESP named stream-box_<version>.efi (default: after the kernel version), as systemd-sysupdate expects it
# (/usr/lib/sysupdate.d/20-uki.transfer): the installed version is then one of its two instances
UnifiedKernelImageFormat=%i_%v

[Content]
Bootable=yes
Bootloader=systemd-boot
# rd.systemd.mask=dbus…: no D-Bus in the initrd (nothing uses it). Otherwise, the slimmed-down (fast) initrd starts it
# just before switching to the system partition and asks it to stop before it is ready: the request gets lost,
# systemd waits 90 s then kills it (black screen or frozen PC logo at boot; seen on a Dell OptiPlex)
# rd.modules-load=i915: Intel graphics driver loaded at the very start of the initrd, the boot screen shows up earlier
# (no effect on other cards: the driver finds nothing there)
# root=PARTLABEL=stream-box_%v: each UKI boots its own system partition (A/B: the partition carries the version in its
# label, see mkosi.repart), so falling back to the previous UKI falls back to the previous system too
KernelCommandLine=root=PARTLABEL=stream-box_%v
                  rw quiet loglevel=3 splash plymouth.ignore-serial-consoles vt.global_cursor_default=0
                  rd.systemd.mask=dbus.socket rd.systemd.mask=dbus-broker.service rd.modules-load=i915
# Boot screen in the initrd (theme: mkosi.initrd.conf), and Intel graphics driver (i915, below) already loaded: a
# single mode change, at the very start, instead of a black screen in the middle of the animation
InitrdProfiles=plymouth
# initrd drivers: mkosi's list for booting (NVMe, SATA, USB drive, btrfs, vfat, keyboard…) and a few more controllers
# (UAS drives, eMMC and SD cards, Intel VMD, virtual machines). The rest (graphics, Wi-Fi, sound…) loads from the
# system partition, which has all the drivers and firmware. Without this line, mkosi puts every driver and its
# firmware (graphics cards…) in the initrd: a ~490 MB unified kernel, which the firmware takes about ten seconds to
# read before booting (111 MB with it)
KernelInitrdModules=default
                    i915
                    uas
                    xhci_pci
                    xhci_hcd
                    ehci_pci
                    /drivers/mmc/
                    vmd
                    virtio_pci
                    virtio_blk
                    virtio_scsi
Hostname=stream-box
Locale=fr_FR.UTF-8
Keymap=fr
Timezone=Europe/Paris
# The whole repository is copied into the image by mkosi.prepare.chroot (/work/src)
BuildSources=..:stream-box
Packages=
    base
    linux
    linux-firmware
    intel-ucode
    amd-ucode
    mesa
    vulkan-intel
    vulkan-nouveau
    vulkan-radeon
    intel-media-driver
    libva-utils
    pipewire
    pipewire-pulse
    pipewire-alsa
    wireplumber
    alsa-utils
    bluez
    bluez-utils
    networkmanager
    btrfs-progs
    wpa_supplicant
    dnsmasq
    iw
    openssh
    sudo
    greetd
    cage
    mpv
    ffmpeg
    grim
    wlr-randr
    python
    git
    curl
    polkit
    plymouth
    udisks2
    exfatprogs
    dosfstools
    libpulse
    nodejs
    npm
    noto-fonts
    noto-fonts-emoji
    ttf-dejavu
    fontconfig
    libxkbcommon
    xcb-util-cursor
    dbus
    less
    nano
    htop

[Build]
# Network for mkosi.prepare.chroot: Python venvs (pip) and YouTube token server (npm)
WithNetwork=yes
CacheDirectory=mkosi.cache
