# Stream Box : image disque prête à flasher (mkosi, base Arch). Construction : image/build.sh (conteneur Docker).
# Le système démarre directement sur la box (greetd lance la session cage de l'utilisateur media) ; le reste de la
# configuration (streamers, Twitch, Jellyfin, MQTT…) se fait depuis la télécommande web, rien de personnel ici.

[Distribution]
Distribution=arch

[Output]
Format=disk
ImageId=stream-box
Output=stream-box
OutputDirectory=mkosi.output

[Content]
Bootable=yes
Bootloader=systemd-boot
# rd.systemd.mask=dbus… : pas de D-Bus dans l'initrd (rien ne s'en sert). Sinon, l'initrd allégé (rapide) le démarre
# juste avant de passer sur la partition système et demande son arrêt avant qu'il soit prêt : la demande se perd,
# systemd attend 90 s puis le tue (écran noir ou logo du PC figé au démarrage ; vu sur un Dell OptiPlex)
# rd.modules-load=i915 : pilote graphique Intel chargé dès le début de l'initrd, l'écran de démarrage s'affiche plus tôt
# (sans effet sur les autres cartes : le pilote n'y trouve rien)
KernelCommandLine=rw quiet loglevel=3 splash plymouth.ignore-serial-consoles vt.global_cursor_default=0
                  rd.systemd.mask=dbus.socket rd.systemd.mask=dbus-broker.service rd.modules-load=i915
# Écran de démarrage dans l'initrd (thème : mkosi.initrd.conf), et pilote graphique Intel (i915, ci-dessous) déjà
# chargé : un seul changement de mode, au tout début, au lieu d'un noir en pleine animation
InitrdProfiles=plymouth
# Pilotes de l'initrd : la liste de mkosi pour démarrer (NVMe, SATA, clé USB, btrfs, vfat, clavier…) et quelques
# contrôleurs en plus (clés UAS, eMMC et cartes SD, Intel VMD, machines virtuelles). Le reste (graphique, Wi-Fi, son…)
# se charge depuis la partition système, qui a tous les pilotes et firmwares. Sans cette ligne, mkosi met dans
# l'initrd tous les pilotes et leurs firmwares (cartes graphiques…) : un noyau unifié de ~490 Mo, que le micrologiciel
# met une dizaine de secondes à lire avant de démarrer (111 Mo avec)
KernelInitrdModules=default
                    i915
                    uas
                    xhci_pci
                    xhci_hcd
                    ehci_pci
                    /drivers/mmc/
                    vmd
                    virtio_pci
                    virtio_blk
                    virtio_scsi
Hostname=stream-box
Locale=fr_FR.UTF-8
Keymap=fr
Timezone=Europe/Paris
# Le dépôt entier est copié dans l'image par mkosi.prepare.chroot (/work/src)
BuildSources=..:stream-box
Packages=
    base
    linux
    linux-firmware
    intel-ucode
    amd-ucode
    mesa
    vulkan-intel
    vulkan-nouveau
    vulkan-radeon
    intel-media-driver
    libva-utils
    pipewire
    pipewire-pulse
    pipewire-alsa
    wireplumber
    alsa-utils
    bluez
    bluez-utils
    networkmanager
    btrfs-progs
    wpa_supplicant
    dnsmasq
    iw
    openssh
    sudo
    greetd
    cage
    mpv
    ffmpeg
    grim
    wlr-randr
    python
    git
    curl
    polkit
    plymouth
    udisks2
    exfatprogs
    dosfstools
    libpulse
    nodejs
    npm
    noto-fonts
    noto-fonts-emoji
    ttf-dejavu
    fontconfig
    libxkbcommon
    xcb-util-cursor
    dbus
    less
    nano
    htop

[Build]
# Réseau pour mkosi.prepare.chroot : venvs Python (pip) et serveur de jetons YouTube (npm)
WithNetwork=yes
CacheDirectory=mkosi.cache
