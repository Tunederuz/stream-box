# Stream Box : réglages de l'initrd par défaut de mkosi. Plymouth y démarre (profil « plymouth », InitrdProfiles= de
# mkosi.conf), avec le thème et la configuration du système : l'écran de démarrage apparaît dès la première seconde.
[Content]
ExtraTrees=../mkosi.extra/usr/share/plymouth:/usr/share/plymouth
           ../mkosi.extra/etc/plymouth:/etc/plymouth
