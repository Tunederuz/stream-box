# Owlink: settings for mkosi's default initrd. Plymouth starts there ("plymouth" profile, InitrdProfiles= in
# mkosi.conf), with the system's theme and configuration: the boot screen shows up from the very first second.
# Emergency mode restarts instead (emergency.service.d: the system partition not found in time, see mkosi.conf).
[Content]
ExtraTrees=../mkosi.extra/usr/share/plymouth:/usr/share/plymouth
           ../mkosi.extra/etc/plymouth:/etc/plymouth
           ../mkosi.extra/etc/systemd/system/emergency.service.d:/etc/systemd/system/emergency.service.d
